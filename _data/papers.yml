  tags: [runaway stars, open clusters, Galactic kinematics]
  project:

- title: "Machine learning methods for constructing probabilistic Fermi-LAT catalogs"
  authors: "Bhat, A., Malyshev, D."
  year: 2022
  journal: "A&A 660, A87"
  doi: 10.1051/0004-6361/202140766
  arxiv: 2102.07642
  ads: https://scixplorer.org/abs/2022A%26A...660A..87B
  summary: >-
