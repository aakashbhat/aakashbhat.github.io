<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  {% if page.class == 'research' %}
  <!-- Research page font: Proxima Nova via Adobe Fonts if a kit is set, else Figtree -->
  {% if site.adobe_fonts_kit %}<link rel="stylesheet" href="https://use.typekit.net/{{ site.adobe_fonts_kit }}.css">{% endif %}
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.class }}"{% if page.runaway %} data-runaway{% endif %}>
  <!-- Background layers (decorative): star-rangoli, grid, scanlines, HUD -->
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="hud tl" aria-hidden="true">SYS // ONLINE<br>RA 17h45m40s · DEC −29°00′28″</div>
  <div class="hud br" aria-hidden="true">GALACTIC CENTRE<br>LOCK ▮▮▮▯</div>
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/sky.js' | relative_url }}"></script>
</body>
</html>
